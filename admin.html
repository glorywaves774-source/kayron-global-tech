<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Kayron Global Tech Services</title><link rel="stylesheet" href="assets/styles.css"><style>
.admin-wrap{max-width:1080px;margin:4rem auto;padding:0 1.25rem}.admin-panel{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:1.5rem;margin:1.2rem 0;box-shadow:0 12px 36px #0b1d3210}.admin-panel h2{margin-top:0}.admin-form{display:grid;gap:.75rem;max-width:560px}.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:.85rem;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.admin-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px solid #e5eaf0;padding:1rem 0}.admin-row p{margin:.25rem 0;color:#64748b}.admin-actions{display:flex;gap:.5rem;align-items:center}.admin-actions button,.admin-form button{border:0;border-radius:8px;padding:.65rem .9rem;background:#125fe8;color:white;cursor:pointer}.admin-actions button.danger{background:#9f2635}.admin-muted{color:#64748b}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}.hidden{display:none!important}.status{font-size:.85rem;color:#0b6a58}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><img src="assets/brand/kayron-symbol.svg" alt="" width="42" height="42"></span><span class="brand-name">KAYRON<small>GLOBAL TECH SERVICES</small></span></a><nav class="main-nav"><a href="index.html">View website ↗</a></nav></header><main class="admin-wrap"><section id="login" class="admin-panel"><div class="eyebrow">PRIVATE ADMINISTRATION</div><h1>Sign in to <em>Kayron.</em></h1><p class="admin-muted">This area is for authorised website administrators.</p><form id="loginForm" class="admin-form"><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><p id="loginNote" role="status"></p></form></section><section id="dashboard" class="hidden"><div class="admin-top"><div><div class="eyebrow">DASHBOARD</div><h1>Website <em>management.</em></h1></div><button id="logout" class="btn btn-primary">Sign out</button></div><div class="admin-panel"><h2>Enquiries <span id="enquiryCount" class="admin-muted"></span></h2><div id="enquiries"></div></div><div class="admin-panel"><h2>Portfolio projects</h2><form id="projectForm" class="admin-form"><label for="projectName">Project name</label><input id="projectName" maxlength="120" required><label for="projectDescription">Description</label><textarea id="projectDescription" rows="3" maxlength="1500"></textarea><label for="projectUrl">Project link (optional)</label><input id="projectUrl" type="text" inputmode="url" maxlength="300" placeholder="https://example.com"><button type="submit">Add project</button><p id="projectNote" role="status"></p></form><div id="projects"></div></div><div class="admin-panel"><h2>Services</h2><p class="admin-muted">Edit the names and descriptions shown on the public website.</p><div id="services"></div></div></section></main><script src="assets/admin.js"></script></body></html>
